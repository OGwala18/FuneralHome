# The staff portal, induduzohome.co.za. Its OWN Netlify site, set to base
# directory `portal` (Netlify then reads this file, not the website's).
# Never bundled with the public site (CLAUDE.md).
#
# Everything under [build.environment] is PUBLIC: VITE_* compiles into the
# browser bundle. The publishable key identifies the Supabase project; it
# grants nothing (the Data API is closed, 0014 and 0025). No secret goes here.

[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"
  VITE_API_BASE_URL = "https://api.induduzo.co.za"
  VITE_SUPABASE_URL = "https://sksisuttffzpctdxtjzt.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_L5Oikcry6LPHo4FTWqbCNA_OslGaLmB"
  VITE_ENVIRONMENT = "production"

# The portal holds a session token in browser storage, so it gets a strict
# policy: only its own code, the API, Supabase sign-in and Google Fonts.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.induduzo.co.za https://sksisuttffzpctdxtjzt.supabase.co; media-src 'self' blob:; upgrade-insecure-requests"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), publickey-credentials-get=(self), publickey-credentials-create=(self)"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Robots-Tag = "noindex, nofollow"

# A single-page app: every path is index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
