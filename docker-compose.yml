# Local development database.
#
# The database is a SEPARATE service from the app, joined only by a connection
# string (AIA foundation 03 §0). Nothing in the repo embeds it.
#
#   docker compose up -d db      # start
#   docker compose down          # stop, keep data
#   docker compose down -v       # stop and DESTROY the local data volume
#
# Migrations in ./db/migrations are applied automatically on FIRST run of an
# empty volume, in filename order. To re-apply from scratch: down -v, then up.

services:
  db:
    image: postgres:17-alpine
    container_name: induduzo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: induduzo
      POSTGRES_PASSWORD: induduzo_local_dev   # local only; never used off this machine
      POSTGRES_DB: induduzo
    ports:
      # 5433 on the host: the machine already runs an aistack Postgres on 5432.
      # Inside the compose network the port is still 5432.
      - "5433:5432"
    volumes:
      - induduzo_pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U induduzo -d induduzo"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Quick data peeks. One small page, no login. http://localhost:8081
  adminer:
    image: adminer:5
    container_name: induduzo-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

  # The full tool: ERD diagrams, query tool, data editing. http://localhost:8082
  # The server connection is pre-configured, so it appears in the tree already
  # connected — no host/port/password to type.
  pgadmin:
    image: dpage/pgadmin4:9
    container_name: induduzo-pgadmin
    restart: unless-stopped
    environment:
      # Must be a routable-looking domain: pgAdmin rejects reserved TLDs
      # such as .local. Nothing is ever sent to it.
      PGADMIN_DEFAULT_EMAIL: admin@induduzo.co.za
      PGADMIN_DEFAULT_PASSWORD: induduzo_local_dev
      # Local-only convenience: skip the login screen entirely.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_DISABLE_POSTFIX: "True"
    ports:
      - "8082:80"
    volumes:
      - ./db/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./db/pgadmin/pgpass:/pgpass.src:ro
      - induduzo_pgadmin:/var/lib/pgadmin
    # libpq silently IGNORES a password file that is not mode 0600 and owned by
    # the connecting user — it reports "no password supplied" rather than a
    # permissions error. A Windows bind mount is always 0777/root, so the file
    # cannot be fixed in place; copy it into the volume (owned by uid 5050) and
    # tighten it there before pgAdmin starts.
    entrypoint:
      - /bin/sh
      - -c
      - cp /pgpass.src /var/lib/pgadmin/pgpass && chmod 600 /var/lib/pgadmin/pgpass && exec /entrypoint.sh
    depends_on:
      db:
        condition: service_healthy

volumes:
  induduzo_pgdata:
  induduzo_pgadmin:
