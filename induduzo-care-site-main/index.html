    <!-- Sets the theme before first paint. Without this the page renders light
         for a frame and then flips, which is a visible white flash for anyone
         on dark mode. Kept inline and dependency-free so it runs immediately. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("induduzo-theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* storage blocked: fall through to the light default */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
