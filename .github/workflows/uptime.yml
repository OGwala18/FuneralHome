name: Uptime

# Every 15 minutes, check the live website, staff portal and API answer, and
# that the API can reach the database. A failed run emails the repository
# owner (GitHub's default for scheduled workflows), which is the alert.
#
# Bonus: the API's /health reads the database each time, so Supabase's free
# tier never sees a week of inactivity and never pauses (db/keepalive.py).
#
# Nothing secret here: these are public URLs.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Live site, portal and API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: API health (database up)
        run: |
          body=$(curl -fsS --retry 3 --retry-delay 20 --max-time 20 https://api.induduzo.co.za/health)
          echo "$body"
          echo "$body" | grep -q '"database":"up"'
      - name: Website
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 20 -o /dev/null https://induduzo.co.za/
      - name: Staff portal
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 20 -o /dev/null https://induduzohome.co.za/
