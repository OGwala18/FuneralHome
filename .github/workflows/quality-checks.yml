name: Quality checks

on:
  push:
    branches:
      - Dev
      - internal
      - main
  pull_request:
    branches:
      - Dev
      - internal
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  validate:
    name: Lint, typecheck, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Check for high-severity dependency vulnerabilities
        run: npm audit --audit-level=high

  # The frontend was scanned but the API was not, so a known CVE in FastAPI,
  # psycopg or their transitive dependencies would have shipped unnoticed.
  backend-audit:
    name: Scan Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use supported Python
        uses: actions/setup-python@v5
        with:
          # 3.12, not 3.14: pydantic-core has no wheel for 3.14.
          python-version: "3.12"

      - name: Scan pinned requirements for known vulnerabilities
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit --requirement requirements.txt --strict
