name: Quality checks

on:
  push:
    branches:
      - Dev
      - internal
      - main
  pull_request:
    branches:
      - Dev
      - internal
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  validate:
    name: Lint, typecheck, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Check for high-severity dependency vulnerabilities
        run: npm audit --audit-level=high

  # The frontend was scanned but the API was not, so a known CVE in FastAPI,
  # psycopg or their transitive dependencies would have shipped unnoticed.
  backend-audit:
    name: Scan Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use supported Python
        uses: actions/setup-python@v5
        with:
          # 3.12, not 3.14: pydantic-core has no wheel for 3.14.
          python-version: "3.12"

      - name: Scan pinned requirements for known vulnerabilities
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit --requirement requirements.txt --strict

  # The API was scanned but never run, so a broken query, a missing grant or a
  # health check that lies would only have been found by a family filling in
  # the form. This builds the schema from the migrations, provisions the API
  # role the way production does, and exercises the endpoints as that role.
  backend-behaviour:
    name: API behaviour
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: induduzo
          # Throwaway database that exists for the length of this job.
          POSTGRES_PASSWORD: ci_only_owner_password
          POSTGRES_DB: induduzo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U induduzo -d induduzo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_OWNER_URL: postgresql://induduzo:ci_only_owner_password@localhost:5432/induduzo
      API_DB_PASSWORD: ci_only_api_password_not_a_secret_0000
      DATABASE_URL: postgresql://induduzo_api:ci_only_api_password_not_a_secret_0000@localhost:5432/induduzo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use supported Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install pinned dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Apply migrations and provision the API role
        run: python db/provision_api_role.py

      - name: Run the behaviour checks
        working-directory: backend
        run: python -m pytest -v

  # Builds the image Railway will deploy, so a broken Dockerfile fails here
  # rather than in the middle of a production release.
  backend-image:
    name: Build the API image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build
        run: docker build --file Dockerfile.backend --tag induduzo-api:ci .

      - name: Confirm the app imports inside the image
        run: docker run --rm induduzo-api:ci python -c "import backend.app.main"
