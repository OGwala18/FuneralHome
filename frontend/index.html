<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Induduzo Funeral Home - Dignified Funeral Services in Pietermaritzburg</title>
    <meta name="description" content="Induduzo Funeral Home: compassionate, affordable funeral services and funeral plans in Pietermaritzburg and the KZN Midlands since 1998. Available 24/7." />
    <meta name="author" content="Induduzo Funeral Home" />
    <link rel="canonical" href="https://induduzo.co.za/" />

    <meta property="og:site_name" content="Induduzo Funeral Home" />
    <meta property="og:title" content="Induduzo Funeral Home - Dignified Care When It Matters Most" />
    <meta property="og:description" content="Funeral services and funeral plans in Pietermaritzburg since 1998. Affordable cover, 24/7 support, compassionate care." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://induduzo.co.za/" />
    <meta property="og:locale" content="en_ZA" />
    <meta property="og:locale:alternate" content="zu_ZA" />

    <!-- "summary", not "summary_large_image": the site has no share image yet,
         and a large card with no image renders as an empty box. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Induduzo Funeral Home" />
    <meta name="twitter:description" content="Funeral services and funeral plans in Pietermaritzburg since 1998. Available 24/7." />

    <!-- What search engines read as the business's identity. Keep the name,
         phones, address and founding year identical to the Google Business
         Profile and to src/lib/contact.ts and src/lib/location.ts. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "@id": "https://induduzo.co.za/#business",
        "name": "Induduzo Funeral Home",
        "url": "https://induduzo.co.za/",
        "description": "Funeral home serving Pietermaritzburg and the KwaZulu-Natal Midlands since 1998: funeral arrangements, funeral plans, repatriations and pre-planning.",
        "foundingDate": "1998",
        "telephone": ["+27797510648", "+27829549241"],
        "email": "Info@induduzo.co.za",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Edendale Main Road, Kwadaya",
          "addressLocality": "Pietermaritzburg",
          "addressRegion": "KwaZulu-Natal",
          "addressCountry": "ZA"
        },
        "areaServed": ["Pietermaritzburg", "KwaZulu-Natal Midlands"],
        "knowsLanguage": ["en", "zu"],
        "sameAs": ["https://www.instagram.com/induduzofuneralhome/"]
      }
    </script>

    <!-- The site is light-only. Declaring the scheme stops the browser from
         rendering native controls (scrollbars, date pickers, autofill) in dark
         on a dark-mode machine, which would otherwise be the one part of the
         page that still switched. -->
    <meta name="color-scheme" content="light" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
